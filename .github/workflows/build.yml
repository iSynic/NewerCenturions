name: Source build

on:
  push:
    tags: ['v*-beta.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux libraries and file chooser
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev zenity xvfb xdotool
      - name: Update Rust
        shell: bash
        run: rustup update stable && rustup component add rustfmt clippy
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: native-release-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-release-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-
      - name: Validate and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/audit_public.py
          if ($LASTEXITCODE) { throw 'Public source audit failed' }
          ./tools/Build.ps1 -Package -BuildJobs ([Environment]::ProcessorCount) -AllowCompilerParallelism -Timings
      - name: Validate and package Linux/macOS
        if: runner.os != 'Windows'
        run: python tools/build_portable.py
      - name: Upload experimental package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.platform }}
          path: |
            target/platform-validation.json
            target/cargo-timings/*.html
          if-no-files-found: ignore

  beta-release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
      - name: Prepare beta for archive verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+-beta\.\d+', tag):
              raise SystemExit('Unexpected beta tag format')
          root = Path('release-assets')
          for platform in ('windows-x86_64', 'linux-x86_64', 'macos-aarch64', 'macos-x86_64'):
              packages = list((root / f'package-{platform}').glob('*.zip'))
              if len(packages) != 1:
                  raise SystemExit(f'Expected one package for {platform}')
              suffix = '' if platform.startswith('windows-') else '-experimental'
              packages[0].rename(root / f'NewerCenturions-{tag}-{platform}{suffix}.zip')
          PY
          cat > release-notes.md <<'NOTES'
          This beta replaces more of the active CPU-state machinery with named game logic. Attacks, reloads, Psi, equipment, shops, character development and story effects now have clearer rules and record views. The translated engine remains available as a reference; this is not a claim that every translated routine has been rewritten or every original behavior verified.

          ### Compatibility and verification

          Save schema 13 and readers for versions 1-12 are unchanged. Keep backups when switching builds. Compatibility with populated original Mac saves remains unverified.

          Local verification passed 318 executable Rust cases, 15 Python checks and six assisted campaign routes with unchanged state, events and save/resume results. The combined local test commands reached their overall time limit; documentation checks and branch receipts completed separately. Formatting, Clippy and release compilation passed. All 293 original files and 390 native fixtures remain unchanged. Test code is 24.52% of maintained production code.

          ### Hive qualification

          The accepted Hive Leader empty-mask/zero-fill compatibility policy is unchanged. The original shape-zero lookup can read outside guest RAM/ROM, and bounded original-code execution showed that readable host memory can affect its result. Original-Mac whole-turn fidelity remains unverified. The qualified policy does not establish complete original-game parity.

          ### Remaining live acceptance

          Current-build user-operated checks remain open for named Save/Open and cancellation; fullscreen/window recovery; held movement, targeting and modal scheduling; inventory, trade and shops; sound/music and preferences; original visuals/help/text placement; and sustained desktop CPU, memory and responsiveness. Headless checks and assisted campaign replays do not close these live-acceptance groups.

          ### Downloads and installation

          Windows x86_64, Linux x86_64, macOS Apple Silicon and macOS Intel packages are included. Linux and macOS remain experimental; native CI validation is separate from live platform acceptance. macOS bundles use ad hoc signatures and are not Developer ID signed or notarized.

          Extract beside your existing New Centurions installation. Original game files and preserved resource forks are required and are not bundled. SHA256SUMS.txt records the verified archive hashes.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/*.zip --verify-tag --draft --title "Newer Centurions $RELEASE_TAG" --notes-file release-notes.md
