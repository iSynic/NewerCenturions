name: Source build

on:
  push:
    tags: ['v*-beta.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux libraries and file chooser
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev zenity xvfb xdotool
      - name: Update Rust
        shell: bash
        run: rustup update stable && rustup component add rustfmt clippy
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: native-release-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-release-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-
      - name: Validate and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/audit_public.py
          if ($LASTEXITCODE) { throw 'Public source audit failed' }
          ./tools/Build.ps1 -Package -BuildJobs ([Environment]::ProcessorCount) -AllowCompilerParallelism -Timings
      - name: Validate and package Linux/macOS
        if: runner.os != 'Windows'
        run: python tools/build_portable.py
      - name: Upload experimental package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.platform }}
          path: |
            target/platform-validation.json
            target/cargo-timings/*.html
          if-no-files-found: ignore

  beta-release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
      - name: Prepare beta for archive verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+-beta\.\d+', tag):
              raise SystemExit('Unexpected beta tag format')
          root = Path('release-assets')
          for platform in ('windows-x86_64', 'linux-x86_64', 'macos-aarch64', 'macos-x86_64'):
              packages = list((root / f'package-{platform}').glob('*.zip'))
              if len(packages) != 1:
                  raise SystemExit(f'Expected one package for {platform}')
              suffix = '' if platform.startswith('windows-') else '-experimental'
              packages[0].rename(root / f'NewerCenturions-{tag}-{platform}{suffix}.zip')
          PY
          cat > release-notes.md <<'NOTES'
          This beta covers 13 changes since beta.13. It closes more routine parity gaps found by re-grading the source against the original 1.3.2 code, and redraws the game's dialogs and windows from the original layouts. Registration checks are not reimplemented and always pass. This is not a claim that every original behavior has been verified.

          ### Dialogs and windows

          - Question, warning and flash windows draw their text inside the original dialog items in the game font on the original line spacing, so long questions such as the Warrior Edit prompt no longer spill out of their frames.
          - Windows open where the original routines place them, in both the 800 x 600 and the small view: the action picker, creature page, encounters, Get Word, the clinic, level-up, the question strip, special abilities, item information, the intro, the logo and the farewell.
          - Selections press in as bevels and check boxes use the original pictures, as the original draws them.
          - The squad, note, editor, information and creation text draws in the original dialog rectangles and colours; script messages are yellow; warnings sit at the original warning position.
          - The trade window's member strips, scroll bars, item button and credits follow the original layout.
          - The Items window is now its own window, with Use, View, Ammo, Weapon, Drop, Join, Split, Refit, Trade and Done on the original button strip. Drop, Join, Split, Use and Done follow the original warnings and order.
          - The squad roster on the main screen uses the original columns and portrait cells.
          - The Apple menu shows only About under a silhouette of the game's icon; the order form is left out.

          ### Rules and persistence

          - The warrior index, erasing, storing, starting level and quitting follow the original roster and checksum rules.
          - Casting admission, automatic warriors' firearm choice, reloading and firing, capture mode, mission end and the ammunition popup follow the original routines.
          - Retreats step back along the party's last move, limited stock gives its warning, script notes wait for the click, and fast spells refund on a refused press.
          - Story notes shown by script, extra records, backing out of a square, the scenario owner check, the last scenario and profile sounds follow the original routines.
          - With the 800 x 600 preference off, the field, sight, combat framing, capture range and recentring follow the original small view.
          - Weapon damage shown for a weapon no worn slot holds scales by one, an approved compatibility choice where the original reads an unset value.

          ### Arithmetic

          Exceptional floating-point results follow modern IEEE-754 evaluation, as recompiled Realmz ports do: infinities and out-of-range conversions saturate, and NaN converts to zero. This is a compatibility policy, not emulation of the Mac FPU or SANE.

          ### Compatibility and verification

          New saves use schema 63. **Saves from earlier betas are not supported**; start a new game or import an original save. Original 1.3.2 saves import and continue, and this has been accepted with saves written by the original game's own save routine. Keep backups when switching builds.

          Local verification passed 405 executable Rust cases, 16 Python checks and six assisted campaign routes with unchanged state, events and save/resume results. Formatting, Clippy and release compilation passed. All 293 original files are unchanged, and the 420 native fixtures pass. Maintained test code is 7.24% of maintained production code; native comparison tests add another 31.31%.

          ### Hive qualification

          The accepted Hive Leader empty-mask/zero-fill compatibility policy is unchanged. The original shape-zero lookup can read outside guest RAM/ROM, and bounded original-code execution showed that readable host memory can affect its result. Original-Mac whole-turn fidelity remains unverified. The qualified policy does not establish complete original-game parity.

          ### Remaining live acceptance

          User-operated checks remain open for Windows desktop workflows and original presentation (typography, styling and timing), live Linux and macOS sessions, graphics and cursor quality, and sound playback quality. Every graphics and sound resource the game data uses decodes headlessly; these checks are about how they look and sound in play. Headless checks and assisted campaign replays do not close them.

          ### Downloads and installation

          Windows x86_64, Linux x86_64, macOS Apple Silicon and macOS Intel packages are included. Linux and macOS remain experimental; native CI validation is separate from live platform acceptance. macOS bundles use ad hoc signatures and are not Developer ID signed or notarized.

          Extract beside your existing New Centurions installation. Original game files and preserved resource forks are required and are not bundled. SHA256SUMS.txt records the verified archive hashes.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/*.zip --verify-tag --draft --title "Newer Centurions $RELEASE_TAG" --notes-file release-notes.md
