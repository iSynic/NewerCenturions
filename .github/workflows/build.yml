name: Source build

on:
  push:
    tags: ['v*-beta.*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux libraries and file chooser
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev zenity xvfb xdotool
      - name: Update Rust
        shell: bash
        run: rustup update stable && rustup component add rustfmt clippy
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: native-release-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: native-release-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-
      - name: Validate and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/audit_public.py
          if ($LASTEXITCODE) { throw 'Public source audit failed' }
          ./tools/Build.ps1 -Package -BuildJobs ([Environment]::ProcessorCount) -AllowCompilerParallelism -Timings
      - name: Validate and package Linux/macOS
        if: runner.os != 'Windows'
        run: python tools/build_portable.py
      - name: Upload experimental package
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.platform }}
          path: |
            target/platform-validation.json
            target/cargo-timings/*.html
          if-no-files-found: ignore

  beta-release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')
    needs: native
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: package-*
          path: release-assets
      - name: Prepare beta for archive verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'v\d+\.\d+\.\d+-beta\.\d+', tag):
              raise SystemExit('Unexpected beta tag format')
          root = Path('release-assets')
          for platform in ('windows-x86_64', 'linux-x86_64', 'macos-aarch64', 'macos-x86_64'):
              packages = list((root / f'package-{platform}').glob('*.zip'))
              if len(packages) != 1:
                  raise SystemExit(f'Expected one package for {platform}')
              suffix = '' if platform.startswith('windows-') else '-experimental'
              packages[0].rename(root / f'NewerCenturions-{tag}-{platform}{suffix}.zip')
          PY
          cat > release-notes.md <<'NOTES'
          This beta covers 83 changes since beta.12. Most of it closes routine parity gaps found by reviewing the source against the original 1.3.2 code: story text, the field map, shops, combat targeting and many screens now follow the original routines, their text and their update order. The source now uses the original author's vocabulary and the manual's terms, and the game has its own application icon. Registration checks are not reimplemented and always pass. This is not a claim that every original behavior has been verified.

          ### Story, field and shops

          - Story text, dialogs and menu actions follow the original routines. Story questions are asked on the original question strip with the scenario's own captions, answer keys and the question tutorial.
          - Stepping off a land's edge slides to the neighbouring land named by the scenario layout.
          - The field map draws the original sight fog, revealing and hiding terrain with the original sight rules.
          - The party can cast a remembered spell from the field with the original admission, casting and result rules.
          - Passive secret search, party conditions and timers, map notes and building pictures follow the original routines.
          - Shop purchases, equipment changes and item inspection follow the original routines.
          - Field and combat ambient sounds use the original selection and cycle, and each music track change draws its title from the game's random numbers as the original does.

          ### Combat

          - The combat panel shows the original warrior and target information, control buttons and party indicators, and opens the original peek and creature popups.
          - The Load control opens the original reserve popup and fits the chosen reserve for one action point and one reload sound.
          - The battlefield draws the original spell field and target overlays. Targeting draws the original aim icons and range readout.
          - Ray casts for shots, spells and psi powers wait the original delay between steps.
          - The Psi target preview includes a rotating spell's rotation, as the cast does.
          - An ally rifle's target scan counts only warriors with stamina left, and a short squad no longer stops ally firearm targeting with an error.

          ### Screens

          - The intro, information, settings, menu, collection, creature, item editor and farewell screens follow the original text runs and layout.
          - The squad screen draws the original restriction panel, difficulty and roster controls.
          - Warrior creation uses the original dialog texts and name entry limits; the appearance and preference pickers use the original layout, icons and selection.
          - The escape question answers only to Y and N, as the original's yes/no prompt does.
          - Rarely seen routines for warrior and tutorial records, saved-game conversion, the roster, help pages and menus follow the original conditions, ordering and text.
          - The window, taskbar and Windows program file show a winged shield icon. On Windows, a taskbar button pinned from an earlier beta shows the new icon after it is unpinned and pinned again.

          ### Source

          The source names records, fields and routines with the original author's vocabulary and uses the manual's terms where it defines them: action points, armor rating, psi resistance, M.O.S. and victory points. Comments describe the game rules they enforce, and long routines are split along their steps. A maintainer starting point and docs index are included.

          ### Arithmetic

          Exceptional floating-point results follow modern IEEE-754 evaluation, as recompiled Realmz ports do: infinities and out-of-range conversions saturate, and NaN converts to zero. This is a compatibility policy, not emulation of the Mac FPU or SANE.

          ### Compatibility and verification

          New saves use schema 62. **Saves from earlier betas are not supported**; start a new game or import an original save. Original 1.3.2 saves import and continue, and this has been accepted with saves written by the original game's own save routine. Keep backups when switching builds.

          Local verification passed 405 executable Rust cases, 16 Python checks and six assisted campaign routes with unchanged state, events and save/resume results. Formatting, Clippy and release compilation passed. All 293 original files are unchanged, and the 420 native fixtures pass. Maintained test code is 7.48% of maintained production code; native comparison tests add another 32.29%.

          ### Hive qualification

          The accepted Hive Leader empty-mask/zero-fill compatibility policy is unchanged. The original shape-zero lookup can read outside guest RAM/ROM, and bounded original-code execution showed that readable host memory can affect its result. Original-Mac whole-turn fidelity remains unverified. The qualified policy does not establish complete original-game parity.

          ### Remaining live acceptance

          User-operated checks remain open for Windows desktop workflows and original presentation (typography, styling and timing), live Linux and macOS sessions, graphics and cursor quality, and sound playback quality. Every graphics and sound resource the game data uses decodes headlessly; these checks are about how they look and sound in play. Headless checks and assisted campaign replays do not close them.

          ### Downloads and installation

          Windows x86_64, Linux x86_64, macOS Apple Silicon and macOS Intel packages are included. Linux and macOS remain experimental; native CI validation is separate from live platform acceptance. macOS bundles use ad hoc signatures and are not Developer ID signed or notarized.

          Extract beside your existing New Centurions installation. Original game files and preserved resource forks are required and are not bundled. SHA256SUMS.txt records the verified archive hashes.
          NOTES
          gh release create "$RELEASE_TAG" release-assets/*.zip --verify-tag --draft --title "Newer Centurions $RELEASE_TAG" --notes-file release-notes.md
