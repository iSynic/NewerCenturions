name: Source build

on:
  push:
    branches: ['**']
    tags: ['v*-beta.*']
  pull_request:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Update Rust
        id: toolchain
        shell: pwsh
        run: |
          rustup update stable
          if ($LASTEXITCODE) { throw 'Rust toolchain update failed' }
          $version = rustc --version
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-ci-v2-cargo-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-ci-v2-cargo-${{ steps.toolchain.outputs.version }}-${{ hashFiles('Cargo.lock') }}-
      - name: Audit public source and history
        run: python tools/audit_public.py
      - name: Build and verify without game assets
        shell: pwsh
        run: ./tools/Build.ps1 -Package -BuildJobs 2 -AllowCompilerParallelism -Timings
      - name: Upload compilation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compilation-timings
          path: |
            target/cargo-timings/*.html
            target/miniquad-check/cargo-timings/*.html
          if-no-files-found: ignore
      - name: Upload Windows package
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime
          path: dist/*.zip
          if-no-files-found: error

  beta-release:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '-beta.')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-runtime
          path: release-assets
      - name: Publish Windows beta
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+-beta\.\d+$') { throw 'Unexpected beta tag format' }
          $archives = @(Get-ChildItem -LiteralPath release-assets -Filter '*.zip')
          if ($archives.Count -ne 1) { throw 'Expected exactly one Windows package' }
          $source = $archives[0]
          $asset = Join-Path release-assets "NewerCenturions-$env:RELEASE_TAG-windows-x86_64.zip"
          Move-Item -LiteralPath $source.FullName -Destination $asset
          @'
          Windows x86_64 beta. Extract the ZIP contents into the existing New Centurions Mac game folder and launch The New Centurions.exe beside the original application.

          Preserved resource forks (.rsrc, adjacent AppleDouble sidecars, or AppleSingle files) are required. Original game content is supplied by the player and is not bundled. No Python, mapping receipt, or extraction step is needed to play.

          This is a work-in-progress reconstruction; complete campaign behavior and original-game parity remain unfinished. Other platforms are not included in this beta.
          '@ | Set-Content -LiteralPath release-notes.md
          gh release create $env:RELEASE_TAG $asset --verify-tag --prerelease --title "Newer Centurions $env:RELEASE_TAG" --notes-file release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Beta release publishing failed' }
