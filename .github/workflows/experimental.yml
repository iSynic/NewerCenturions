name: Experimental platforms

on:
  push:
    branches: ['experimental/platforms']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x86_64
            runner: windows-2022
          - platform: linux-x86_64
            runner: ubuntu-22.04
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install Linux libraries and file chooser
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libx11-dev libxi-dev libgl1-mesa-dev libasound2-dev zenity
      - name: Update Rust
        shell: bash
        run: rustup update stable && rustup component add rustfmt clippy
      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: experimental-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-${{ github.sha }}
          restore-keys: experimental-v1-${{ matrix.platform }}-${{ hashFiles('Cargo.lock') }}-
      - name: Validate and package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python tools/audit_public.py
          if ($LASTEXITCODE) { throw 'Public source audit failed' }
          ./tools/Build.ps1 -Package -Timings
      - name: Validate and package Linux/macOS
        if: runner.os != 'Windows'
        run: python tools/build_portable.py
      - name: Upload experimental package
        uses: actions/upload-artifact@v4
        with:
          name: experimental-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.platform }}
          path: |
            target/platform-validation.json
            target/cargo-timings/*.html
          if-no-files-found: ignore
