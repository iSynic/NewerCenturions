[package]
autotests = false
name = "centurions-content"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
encoding_rs = "=0.8.35"

[features]
default = []
original-fixtures = []

[[test]]
name = "installation"
path = "tests/installation.rs"
required-features = ["original-fixtures"]

[[test]]
name = "scenario_terrain"
path = "tests/scenario_terrain.rs"
required-features = ["original-fixtures"]

[[test]]
name = "ui_backgrounds"
path = "tests/ui_backgrounds.rs"
required-features = ["original-fixtures"]

[[test]]
name = "ui_indexed_pictures"
path = "tests/ui_indexed_pictures.rs"
required-features = ["original-fixtures"]

[[test]]
name = "ui_resources"
path = "tests/ui_resources.rs"
required-features = ["original-fixtures"]
