[workspace]
members = ["crates/content", "crates/core", "crates/tools", "crates/desktop"]
resolver = "2"
exclude = ["vendor/miniquad"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
centurions-content = { path = "crates/content" }
centurions-core = { path = "crates/core" }

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }
