[workspace]
members = ["crates/content", "crates/core", "crates/tools", "crates/desktop", "crates/translated-gameplay", "crates/translated-system", "crates/translated-application", "crates/translated"]
resolver = "2"
exclude = ["vendor/miniquad"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
centurions-content = { path = "crates/content" }
centurions-core = { path = "crates/core" }

[patch.crates-io]
miniquad = { path = "vendor/miniquad" }

[profile.release.package.centurions-translated-gameplay]
opt-level = 1
codegen-units = 256
incremental = true

[profile.release.package.centurions-translated-system]
opt-level = 1
codegen-units = 256
incremental = true

[profile.release.package.centurions-translated-application]
opt-level = 1
codegen-units = 256
incremental = true

[profile.release.package.centurions-translated]
opt-level = 1
codegen-units = 256
incremental = true
